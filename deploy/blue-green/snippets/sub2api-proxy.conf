# Sub2API 公共 proxy 参数（所有站点共用）—— 由 s2a-render 安装到
# /etc/nginx/snippets/sub2api-proxy.conf，源文件在仓库 deploy/blue-green/snippets/。
#
# SSE 语义依赖以下每一项，缺任一项都会破坏流式响应（FR-6.1）。

proxy_http_version 1.1;
proxy_set_header Connection ""; # 保持与 upstream 的 keepalive（FR-6.3）

# SSE / 流式响应必须
proxy_buffering off;
proxy_cache off;
proxy_request_buffering off;
gzip off; # 不压缩 SSE
chunked_transfer_encoding on;

# 转发头只从真实 TCP 对端生成，不透传客户端伪造值（FR-6.4）。
# 若 nginx 前还有 CDN，请改用 real_ip_module + set_real_ip_from <CDN CIDR>，
# 参考 deploy/EDGE_SECURITY.md。
proxy_set_header X-Real-IP        $remote_addr;
proxy_set_header X-Forwarded-For  $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Host             $host;

proxy_connect_timeout 10s;
# 必须 ≥ 应用侧流间隔超时（默认 900s）+ 余量（FR-6.2）
proxy_send_timeout 960s;
