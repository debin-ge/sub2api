name: Build and Push to GitHub Container Registry

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-session-recovery:
    name: Build Session Recovery for ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            goos: linux
            goarch: arm64
            runner: ubuntu-latest
          - platform: darwin/amd64
            goos: darwin
            goarch: amd64
            runner: macos-latest
          - platform: darwin/arm64
            goos: darwin
            goarch: arm64
            runner: macos-latest
          - platform: windows/amd64
            goos: windows
            goarch: amd64
            runner: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Session Recovery
        working-directory: tools/session-recovery
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p bin
          if [ "${{ matrix.goos }}" = "windows" ]; then
            go build -ldflags="-s -w" -trimpath -o bin/session-recovery.exe ./main.go
          else
            go build -ldflags="-s -w" -trimpath -o bin/session-recovery ./main.go
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: session-recovery-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tools/session-recovery/bin/session-recovery*
          retention-days: 1

  build-docker:
    name: Build and Push Docker Image
    needs: build-session-recovery
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Session Recovery artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Session Recovery binaries
        run: |
          mkdir -p session-recovery-binaries/linux_amd64
          mkdir -p session-recovery-binaries/linux_arm64
          mkdir -p session-recovery-binaries/darwin_amd64
          mkdir -p session-recovery-binaries/darwin_arm64
          mkdir -p session-recovery-binaries/windows_amd64

          cp artifacts/session-recovery-amd64/session-recovery session-recovery-binaries/linux_amd64/
          cp artifacts/session-recovery-arm64/session-recovery session-recovery-binaries/linux_arm64/
          cp artifacts/session-recovery-darwin-amd64/session-recovery session-recovery-binaries/darwin_amd64/
          cp artifacts/session-recovery-darwin-arm64/session-recovery session-recovery-binaries/darwin_arm64/
          cp artifacts/session-recovery-windows-amd64/session-recovery.exe session-recovery-binaries/windows_amd64/

          chmod +x session-recovery-binaries/linux_amd64/session-recovery
          chmod +x session-recovery-binaries/linux_arm64/session-recovery
          chmod +x session-recovery-binaries/darwin_amd64/session-recovery
          chmod +x session-recovery-binaries/darwin_arm64/session-recovery

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Generate deployment summary
        run: |
          echo "## 📦 GitHub Container Registry" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
