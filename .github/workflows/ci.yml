name: CI

# 质量门：PR 与 main 推送时运行；tag 发布构建见 docker-ghcr.yml
on:
  pull_request:
  push:
    branches:
      - main

# 同一分支的新推送自动取消上一轮未完成的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + test + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # 与 backend/Makefile 的 test 目标对齐（go test + golangci-lint）
      # backend/.golangci.yml 为 v2 配置，需使用 action@v8+（v9 起运行于 Node 24）
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: backend

  frontend:
    name: Frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # 版本与 Dockerfile 的 PNPM_VERSION 保持一致
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.0.8

      # 版本与 Dockerfile 的 NODE_IMAGE (node:24-alpine) 保持一致
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      # 复用根 Makefile 的口径：lint:check + typecheck + 关键 vitest 用例
      - name: Lint / typecheck / critical tests
        run: make test-frontend

      # 完整构建（vue-tsc -b + vite build + 入口隐私断言），与 Docker 构建同路径
      - name: Build
        run: pnpm --dir frontend run build

  session-recovery:
    name: Session Recovery (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/session-recovery
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/session-recovery/go.mod
          cache-dependency-path: tools/session-recovery/go.sum

      # 提前暴露编译问题，避免 tag 发布时 docker-ghcr.yml 才发现挂掉
      - name: Build
        run: go build ./...
