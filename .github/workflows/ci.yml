name: CI

# 质量门：PR、main 与 test 分支推送时运行；test 分支和 test-* tag
# 额外运行视频集成测试并构建测试镜像；正式数字 tag 发布见 docker-ghcr.yml。
on:
  pull_request:
  push:
    branches:
      - main
      - test
    tags:
      - 'test-*'
  workflow_dispatch:

# 同一分支的新推送自动取消上一轮未完成的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 默认最小权限：仅读代码。需要更多权限的 job（migration-gate 读 PR 标签、
# build-test-image 推送镜像）在 job 级别自行声明。
permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + test + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate deployment runtime manifests
        working-directory: .
        run: |
          /bin/sh deploy/test-caddyfile-cache.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      # 默认 tag：不带构建标签的测试（对齐 backend/Makefile 的 test 目标）
      - name: Test (default tags)
        run: go test ./...

      # unit tag：仓库内 350+ 个测试文件带 //go:build unit，默认 tag 下不会被编译。
      # 缺这一步等于整套单元测试在 CI 里从不执行——v0.1.166 合并时 GLM 兜底价被
      # 静默改动 25~75% 却「测试全绿」，就是因为断言和实现都没被跑到。
      # 对齐 backend/Makefile 的 test-unit 目标。
      - name: Test (unit tags)
        run: go test -tags=unit ./...

      - name: Generated code is up to date
        run: |
          make generate
          git diff --exit-code

      # 与 backend/Makefile 的 test 目标对齐（go test + golangci-lint）
      # backend/.golangci.yml 为 v2 配置，需使用 action@v8+（v9 起运行于 Node 24）
      # golangci-lint 版本固定而非 latest：避免上游新版本引入新规则时 CI 无预警变红
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: backend

  vip-integration:
    name: VIP security integration (PostgreSQL 16 + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run VIP, fallback graph, migration, and durable invalidation integration tests
        env:
          SUB2API_TEST_POSTGRES_IMAGE: postgres:16-alpine
        run: >-
          go test -tags=integration ./internal/repository
          -run 'Test(VIP|AuthCacheInvalidationTriggers|GroupRepoSuite|MigrationsRunner)'
          -count=1

  video-integration:
    name: Test environment video integration (PostgreSQL 16 + Redis)
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/test' || startsWith(github.ref, 'refs/tags/test-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run video, balance hold, and usage billing integration tests
        env:
          SUB2API_TEST_POSTGRES_IMAGE: postgres:16-alpine
        run: >-
          go test -tags=integration ./internal/repository
          -run 'Video|BalanceHold|UsageBilling'
          -count=1

  # 迁移门禁：保证 backend/migrations/ 变更满足蓝绿发布的 expand-contract 纪律
  # （规则见 backend/migrations/README.md）。破坏性迁移需给 PR 打 breaking-migration
  # 标签后重跑本 job（标签实时查询，Re-run 即可生效）。
  migration-gate:
    name: Migration gate (expand-contract)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 需要完整历史以计算与 base 的 merge-base diff
          fetch-depth: 0

      - name: Check migration changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          allow=""
          if gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -qx 'breaking-migration'; then
            allow="--allow-breaking"
          fi
          backend/scripts/check-migration-gate.sh "$BASE_SHA" $allow

  frontend:
    name: Frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 版本与 Dockerfile 的 PNPM_VERSION 保持一致
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.0.8

      # 版本与 Dockerfile 的 NODE_IMAGE (node:24-alpine) 保持一致
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      # 复用根 Makefile 的口径：lint:check + typecheck + 完整 Vitest/入口隐私测试
      - name: Lint / typecheck / full tests
        run: make test-frontend

      # 完整构建（vue-tsc -b + vite build + 入口隐私断言），与 Docker 构建同路径
      - name: Build
        run: pnpm --dir frontend run build

  build-test-image:
    name: Build and push test image
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/test' || startsWith(github.ref, 'refs/tags/test-') }}
    needs:
      - backend
      - vip-integration
      - video-integration
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: test-image-${{ github.repository }}
      cancel-in-progress: false
    environment:
      name: test
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract test image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=test
            type=sha,prefix=test-sha-,format=short
          flavor: |
            latest=false

      - name: Resolve build date
        id: build-info
        run: echo "date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push test image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.build-info.outputs.date }}
          cache-from: type=gha,scope=test-image
          cache-to: type=gha,mode=max,scope=test-image
          platforms: linux/amd64,linux/arm64

      - name: Generate test image summary
        run: |
          echo "## GitHub Container Registry test image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tags:**" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
