name: CI

# 质量门：PR 与 main 推送时运行；tag 发布构建见 docker-ghcr.yml
on:
  pull_request:
  push:
    branches:
      - main

# 同一分支的新推送自动取消上一轮未完成的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + test + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate Caddy streaming configuration
        working-directory: .
        run: /bin/sh deploy/test-caddyfile-cache.sh

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      # 默认 tag：不带构建标签的测试（对齐 backend/Makefile 的 test 目标）
      - name: Test (default tags)
        run: go test ./...

      # unit tag：仓库内 350+ 个测试文件带 //go:build unit，默认 tag 下不会被编译。
      # 缺这一步等于整套单元测试在 CI 里从不执行——v0.1.166 合并时 GLM 兜底价被
      # 静默改动 25~75% 却「测试全绿」，就是因为断言和实现都没被跑到。
      # 对齐 backend/Makefile 的 test-unit 目标。
      - name: Test (unit tags)
        run: go test -tags=unit ./...

      # 与 backend/Makefile 的 test 目标对齐（go test + golangci-lint）
      # backend/.golangci.yml 为 v2 配置，需使用 action@v8+（v9 起运行于 Node 24）
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: backend

  # 迁移门禁：保证 backend/migrations/ 变更满足蓝绿发布的 expand-contract 纪律
  # （规则见 backend/migrations/README.md）。破坏性迁移需给 PR 打 breaking-migration
  # 标签后重跑本 job（标签实时查询，Re-run 即可生效）。
  migration-gate:
    name: Migration gate (expand-contract)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # 需要完整历史以计算与 base 的 merge-base diff
          fetch-depth: 0

      - name: Check migration changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          allow=""
          if gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -qx 'breaking-migration'; then
            allow="--allow-breaking"
          fi
          backend/scripts/check-migration-gate.sh "$BASE_SHA" $allow

  frontend:
    name: Frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # 版本与 Dockerfile 的 PNPM_VERSION 保持一致
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.0.8

      # 版本与 Dockerfile 的 NODE_IMAGE (node:24-alpine) 保持一致
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      # 复用根 Makefile 的口径：lint:check + typecheck + 关键 vitest 用例
      - name: Lint / typecheck / critical tests
        run: make test-frontend

      # 完整构建（vue-tsc -b + vite build + 入口隐私断言），与 Docker 构建同路径
      - name: Build
        run: pnpm --dir frontend run build
