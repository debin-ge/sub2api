<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ZenTok</title>
  <desc id="desc">An arrow-shaped Z mark representing a unified gateway routing requests across AI models.</desc>
  <defs>
    <linearGradient id="zt-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset=".55" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#0c1a3d"/>
    </linearGradient>
    <linearGradient id="zt-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0e7ff"/>
      <stop offset=".55" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#zt-bg)"/>
  <path d="M160 176 H352 L192 336 H352" stroke="url(#zt-mark)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="352" cy="176" r="15" fill="#a5f3fc"/>
  <circle cx="192" cy="336" r="15" fill="#c7d2fe"/>
</svg>
