<title>ZenTok Console</title>
<style>
/* ============================================================
   ZenTok 控制台改版 · 第三轮：围绕「管理端菜单多且平、用户端菜单少、二级页稀少」设计的两种壳
   D 分域侧栏工作台：侧栏承载长列表（按域分组，仅视觉分组，不强制层级）+ 顶部上下文条 + 编辑式内容
   E 顶栏分域 + 二级页签：管理端 6 个域进顶栏，域下页面进二级页签行；用户端直接平铺，无二级行
   两壳共用同一套页面内容（概览 / API 密钥分栏），用户/管理员视角只切换导航。
   ============================================================ */
:root{
  color-scheme:light;
  --ground:#f5f6fb; --surface:#ffffff; --surface-2:#f1f3f9; --surface-3:#e9ecf5;
  --border:#e4e7f0; --border-2:#d2d8e6;
  --ink:#0f172a; --ink-2:#475569; --ink-3:#8b95a9;
  --accent:#4f46e5; --accent-500:#6366f1; --accent-400:#818cf8; --accent-300:#a5b4fc;
  --accent-50:#eef2ff; --accent-100:#e0e7ff; --accent-200:#c7d2fe;
  --cyan:#06b6d4; --cyan-400:#22d3ee;
  --good:#059669; --good-bg:#ecfdf5; --good-ink:#047857;
  --warn:#d97706; --warn-bg:#fffbeb; --warn-ink:#b45309;
  --bad:#dc2626;  --bad-bg:#fef2f2;  --bad-ink:#b91c1c;
  --s1:#4f46e5; --s2:#d97706; --s3:#0891b2; --s4:#e11d48; --s5:#7c3aed; --s6:#059669; --s-other:#94a3b8;
  --brand-dark:#020617; --brand-dark-2:#0f172a;
  --shadow-card:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.06);
  --shadow-pop:0 16px 40px -16px rgba(15,23,42,.28);
  --glow:0 0 20px rgba(99,102,241,.28);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#020617; --surface:#0f172a; --surface-2:#172033; --surface-3:#1e293b;
    --border:#1e293b; --border-2:#334155;
    --ink:#f1f5f9; --ink-2:#94a3b8; --ink-3:#64748b;
    --accent:#818cf8; --accent-50:rgba(99,102,241,.14); --accent-100:rgba(99,102,241,.24); --accent-200:rgba(99,102,241,.36);
    --good:#34d399; --good-bg:rgba(16,185,129,.14); --good-ink:#6ee7b7;
    --warn:#fbbf24; --warn-bg:rgba(245,158,11,.14); --warn-ink:#fcd34d;
    --bad:#f87171; --bad-bg:rgba(239,68,68,.14); --bad-ink:#fca5a5;
    --s1:#6366f1; --s2:#d97706; --s3:#0891b2; --s4:#f43f5e; --s5:#8b5cf6; --s6:#059669; --s-other:#475569;
    --shadow-card:0 1px 2px rgba(0,0,0,.3); --shadow-pop:0 16px 40px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#020617; --surface:#0f172a; --surface-2:#172033; --surface-3:#1e293b;
  --border:#1e293b; --border-2:#334155;
  --ink:#f1f5f9; --ink-2:#94a3b8; --ink-3:#64748b;
  --accent:#818cf8; --accent-50:rgba(99,102,241,.14); --accent-100:rgba(99,102,241,.24); --accent-200:rgba(99,102,241,.36);
  --good:#34d399; --good-bg:rgba(16,185,129,.14); --good-ink:#6ee7b7;
  --warn:#fbbf24; --warn-bg:rgba(245,158,11,.14); --warn-ink:#fcd34d;
  --bad:#f87171; --bad-bg:rgba(239,68,68,.14); --bad-ink:#fca5a5;
  --s1:#6366f1; --s2:#d97706; --s3:#0891b2; --s4:#f43f5e; --s5:#8b5cf6; --s6:#059669; --s-other:#475569;
  --shadow-card:0 1px 2px rgba(0,0,0,.3); --shadow-pop:0 16px 40px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
h1,h2,h3,h4{text-wrap:balance}
svg.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
svg.ico.sm{width:16px;height:16px} svg.ico.xs{width:14px;height:14px}
.mono{font-family:var(--mono)} .num{font-family:var(--mono);font-variant-numeric:tabular-nums} .dim{color:var(--ink-3)} .muted{color:var(--ink-2)}
:focus-visible{outline:2px solid var(--accent-500);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@keyframes ping{75%,100%{transform:scale(2.4);opacity:0}}
.dot-live{position:relative;display:inline-flex;width:6px;height:6px;flex:none}
.dot-live::before{content:"";position:absolute;inset:0;border-radius:50%;background:#34d399;opacity:.75;animation:ping 1.6s cubic-bezier(0,0,.2,1) infinite}
.dot-live::after{content:"";position:relative;width:6px;height:6px;border-radius:50%;background:#34d399}
.tech-grid{background-image:linear-gradient(rgba(129,140,248,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(129,140,248,.14) 1px,transparent 1px);background-size:32px 32px;-webkit-mask-image:radial-gradient(ellipse 80% 65% at 50% 0%,#000 40%,transparent 100%);mask-image:radial-gradient(ellipse 80% 65% at 50% 0%,#000 40%,transparent 100%)}

/* ---------- 共享原子 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 13px;border-radius:9px;font-size:13px;font-weight:500;white-space:nowrap}
.btn-primary{background:linear-gradient(90deg,#6366f1,#4f46e5);color:#fff;box-shadow:0 4px 14px rgba(99,102,241,.3)}
.btn-secondary{background:var(--surface);color:var(--ink);border:1px solid var(--border-2)} .btn-secondary:hover{background:var(--surface-2)}
.btn-ghost{color:var(--ink-2)} .btn-ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn-sm{height:28px;padding:0 9px;font-size:12px;border-radius:7px} .btn-icon{width:34px;padding:0}
.ibtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);position:relative} .ibtn:hover{background:var(--surface-2);color:var(--ink)}
.ibtn .badge-dot{position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--surface)}
.input{height:34px;border:1px solid var(--border-2);border-radius:9px;background:var(--surface);color:var(--ink);padding:0 11px;font:inherit;font-size:13px;min-width:0}
.input:focus{border-color:var(--accent-400);outline:none;box-shadow:0 0 0 3px var(--accent-100)} .input::placeholder{color:var(--ink-3)}
.select{appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 14px) 14px,calc(100% - 9px) 14px;background-size:5px 5px;background-repeat:no-repeat}
.search{position:relative;flex:1;min-width:160px;max-width:300px} .search .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none} .search .input{width:100%;padding-left:32px}
.chips{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border)}
.chip{height:26px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px} .chip.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(15,23,42,.08)}
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap} .badge i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.badge-good{background:var(--good-bg);color:var(--good-ink)} .badge-warn{background:var(--warn-bg);color:var(--warn-ink)} .badge-bad{background:var(--bad-bg);color:var(--bad-ink)} .badge-gray{background:var(--surface-3);color:var(--ink-2)}
.badge-plat{background:var(--surface-2);color:var(--ink);border:1px solid var(--border)} .badge-plat i{background:var(--accent-500)} .badge-plat .mult{font:500 11px/1 var(--mono);color:var(--ink-3)}
.meter{height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden} .meter>i{display:block;height:100%;border-radius:999px;background-image:linear-gradient(90deg,#4f46e5,#22d3ee)} .meter.warn>i{background-image:linear-gradient(90deg,#d97706,#fbbf24)} .meter.thin{height:4px}
.kbd{font:500 10.5px/1 var(--mono);border:1px solid var(--border-2);border-radius:5px;padding:2px 5px;color:var(--ink-3)}
.spark{color:var(--accent-500);position:relative} .spark svg{display:block;overflow:visible;width:100%;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)} .legend span{display:inline-flex;align-items:center;gap:6px} .legend i{width:10px;height:3px;border-radius:2px;display:inline-block}
.chart{position:relative;width:100%} .chart svg{width:100%;height:auto;display:block;font-family:var(--mono);font-variant-numeric:tabular-nums}
.chart .grid-line{stroke:var(--border);stroke-width:1} .chart .axis-text{fill:var(--ink-3);font-size:11px}
.chart .xh{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3;opacity:0} .chart .hover-dot{opacity:0} .chart.hover .xh,.chart.hover .hover-dot{opacity:1}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--surface);border:1px solid var(--border-2);border-radius:10px;padding:8px 10px;box-shadow:var(--shadow-pop);font-size:12px;min-width:140px;display:none}
.tip b{display:block;font-family:var(--mono);color:var(--ink-3);font-weight:500;margin-bottom:4px} .tip div{display:flex;justify-content:space-between;gap:14px;align-items:center}
.tip div span:first-child{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)} .tip div span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)} .tip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.hbars{display:flex;flex-direction:column;gap:10px} .hbar{display:grid;grid-template-columns:150px 1fr 110px;gap:12px;align-items:center;font-size:12.5px}
.hbar .n{display:flex;align-items:center;gap:7px;min-width:0} .hbar .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .hbar .n i{width:8px;height:8px;border-radius:2px;flex:none}
.hbar .t{height:12px;border-radius:0 4px 4px 0;background:var(--surface-2);position:relative} .hbar .t i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0}
.hbar .v{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-2);display:flex;justify-content:flex-end;gap:10px} .hbar .v b{color:var(--good);font-weight:600}
.table-wrap{overflow-x:auto} .table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;padding:9px 12px;font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap}
.table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap} .table tr:last-child td{border-bottom:0} .table tbody tr:hover td{background:var(--surface-2)}
.table .r{text-align:right} .table th:first-child,.table td:first-child{padding-left:16px} .table th:last-child,.table td:last-child{padding-right:16px}
.strike{text-decoration:line-through;color:var(--ink-3);font-weight:400}
.avatar{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#6366f1,#22d3ee);color:#fff;display:grid;place-items:center;font:700 11px/1 var(--mono);flex:none}
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:13px;margin:0} .dl dt{color:var(--ink-3)} .dl dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums}
.dim-date{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:12px}

/* ---------- 页面内容（两壳共用）：编辑式版式 ---------- */
.body{display:flex;flex-direction:column;gap:32px;min-width:0}
.pg{display:flex;flex-direction:column;gap:28px;min-width:0} .pg[data-page="keys"]{gap:16px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em} .page-head p{margin:3px 0 0;font-size:12.5px;color:var(--ink-3)} .page-head .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.kpi{padding:20px 20px 20px 0;margin-right:20px;border-right:1px solid var(--border);min-width:0;display:flex;gap:12px} .kpi:last-child{border-right:0;margin-right:0}
.kpi .l{font-size:12px;color:var(--ink-2);font-weight:500} .kpi .v{font:700 28px/1.1 var(--mono);letter-spacing:-.02em;margin-top:8px;white-space:nowrap}
.kpi .d{margin-top:8px;font-size:12px;color:var(--ink-3);display:flex;gap:8px;align-items:center;flex-wrap:wrap} .kpi .d b{color:var(--good);font-weight:600} .kpi .d .down{color:var(--bad)}
.kpi .spark{width:72px;height:30px;margin-left:auto;align-self:flex-end}
.sec{min-width:0} .sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:18px;flex-wrap:wrap}
.sec-h h2{margin:0;font-size:15px;font-weight:600} .sec-h .sub{display:block;font-size:12px;color:var(--ink-3);margin-top:2px;font-weight:400}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:44px}
.plist{display:flex;flex-direction:column} .plist .p{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)} .plist .p:last-child{border-bottom:0}
.lg{border-radius:8px;display:grid;place-items:center;color:#fff;font:700 11px/1 var(--mono);flex:none}
.plist b{font-size:13px;font-weight:600;display:block} .plist small{font:11.5px/1.4 var(--mono);color:var(--ink-3);display:block;margin-top:2px}
.plist .q{width:150px;display:flex;flex-direction:column;gap:5px;align-items:flex-end} .plist .q span{font:500 11.5px/1 var(--mono);color:var(--ink-2)} .plist .q .meter{width:100%}
.feed{display:flex;flex-direction:column} .feed .f{display:grid;grid-template-columns:76px 1.2fr 1.4fr 1fr 1fr 60px;gap:16px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);font-size:13px} .feed .f:last-child{border-bottom:0}
.feed .t{font:12px/1 var(--mono);color:var(--ink-3)} .feed .m{font-family:var(--mono);font-size:12.5px} .feed .k{color:var(--ink-2)} .feed .c{font-family:var(--mono);text-align:right} .feed .c b{color:var(--good);font-weight:600} .feed .tk{font:12px var(--mono);color:var(--ink-3);text-align:right}
/* 密钥：列表 / 详情分栏 */
.split{display:grid;grid-template-columns:300px minmax(0,1fr);border:1px solid var(--border);border-radius:14px;background:var(--surface);overflow:hidden;min-height:640px}
.kl{background:var(--surface-2);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0}
.kl-h{padding:12px 12px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--border)} .kl-h .row{display:flex;align-items:center;gap:8px} .kl-h h2{margin:0;font-size:14px;font-weight:700;flex:1} .kl-h .cnt{font:500 11px/1 var(--mono);color:var(--ink-3)} .kl-h .search{max-width:none}
.kl-f{display:flex;gap:4px;flex-wrap:wrap} .kl-f .chip{height:24px;padding:0 8px;font-size:11.5px;border:1px solid transparent} .kl-f .chip.on{background:var(--surface);border-color:var(--border-2)}
.kl-items{flex:1;overflow:auto;padding:6px 8px;display:flex;flex-direction:column;gap:2px} .kl-g{padding:10px 8px 4px;font:600 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.kl-item{display:flex;flex-direction:column;gap:4px;padding:9px 10px;border-radius:9px;border:1px solid transparent;width:100%} .kl-item:hover{background:var(--surface-3)} .kl-item.on{background:var(--surface);border-color:var(--border);box-shadow:var(--shadow-card)}
.kl-item .t{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600} .kl-item .t i{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none} .kl-item.off .t i{background:var(--ink-3)}
.kl-item .m{display:flex;justify-content:space-between;font:11.5px/1 var(--mono);color:var(--ink-3)} .kl-item .m b{color:var(--ink-2);font-weight:500} .kl-item .meter{margin-top:2px}
.kd{padding:20px 22px;display:flex;flex-direction:column;gap:18px;min-width:0}
.kd-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap} .kd-head h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:8px} .kd-head .meta{font:12px/1 var(--mono);color:var(--ink-3)} .kd-head .right{margin-left:auto;display:flex;gap:8px}
.keybox{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);font:500 13px/1 var(--mono);color:var(--ink)} .keybox .lab{font-size:11px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase} .keybox code{flex:1;font:inherit;color:var(--accent);min-width:0;overflow:hidden;text-overflow:ellipsis}
.panel{border:1px solid var(--border);border-radius:12px;background:var(--surface)} .panel-h{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap} .panel-h h3{margin:0;font-size:13px;font-weight:600} .panel-h .sub{font-size:11.5px;color:var(--ink-3);margin-left:8px;font-weight:400} .panel-b{padding:14px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.quota-rows{display:flex;flex-direction:column;gap:10px} .quota-rows .q{display:grid;grid-template-columns:52px 1fr 120px;gap:12px;align-items:center;font-size:12.5px} .quota-rows .q em{font-style:normal;color:var(--ink-2)} .quota-rows .q span{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;color:var(--ink-2)}
.pager{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--border);font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.ep-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)} .ep-line .lab{font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:inline-flex;align-items:center;gap:8px}
.ep-chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border-2);border-radius:8px;padding:5px 8px 5px 10px;font:500 12.5px/1 var(--mono);color:var(--ink);background:var(--surface)} .ep-chip .tag{font-size:10px;padding:2px 6px;border-radius:999px;background:var(--accent-50);color:var(--accent);font-family:var(--sans)} .ep-chip .ico{color:var(--ink-3);width:14px;height:14px}

/* ===================== 壳 D：分域侧栏工作台 ===================== */
.sd{position:fixed;top:0;bottom:0;left:0;width:240px;background:linear-gradient(180deg,var(--brand-dark-2),var(--brand-dark));color:#e2e8f0;border-right:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;z-index:40;overflow:hidden;transition:width .22s ease}
.sd .fx{position:absolute;inset:0 0 auto 0;height:260px;pointer-events:none;opacity:.7} .sd .glow{position:absolute;top:-140px;left:50%;width:360px;height:260px;transform:translateX(-50%);background:rgba(99,102,241,.32);filter:blur(80px);pointer-events:none}
.sd>*{position:relative}

const tip=$('#tip');
function showTip(x,y,html){tip.innerHTML=html;tip.style.display='block';const r=tip.getBoundingClientRect();let left=x+14,top=y-10;if(left+r.width>window.innerWidth-8)left=x-r.width-14;if(top+r.height>window.innerHeight-8)top=window.innerHeight-r.height-8;tip.style.left=left+'px';tip.style.top=Math.max(8,top)+'px';}
function hideTip(){tip.style.display='none';}
function sparkline(el){const data=el.dataset.spark.split(',').map(Number);const w=96,h=32,p=3;const max=Math.max(...data),min=Math.min(...data);const xs=i=>p+i*(w-2*p)/(data.length-1),ys=v=>h-p-((v-min)/((max-min)||1))*(h-2*p);const pts=data.map((v,i)=>xs(i).toFixed(1)+','+ys(v).toFixed(1));const line='M'+pts.join(' L');const area=line+' L'+xs(data.length-1).toFixed(1)+','+h+' L'+xs(0)+','+h+' Z';el.innerHTML=`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${area}" fill="currentColor" opacity=".12"/><path d="${line}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg><svg viewBox="0 0 ${w} ${h}" style="position:absolute;inset:0" aria-hidden="true"><circle cx="${xs(data.length-1).toFixed(1)}" cy="${ys(data[data.length-1]).toFixed(1)}" r="3" fill="currentColor" stroke="var(--surface)" stroke-width="2"/></svg>`;}
function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw)));const n=raw/p;const m=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;return m*p;}
function areaChart(el,cfg,legendEl,Hh=220){const W=Math.max(360,Math.round(el.clientWidth||720)),pl=52,pr=18,pt=14,pb=28;const n=cfg.labels.length;const fmt=cfg.fmt||fmtTok;const dmax=Math.max(...cfg.series.flatMap(s=>s.data));const step=niceStep(dmax/4);const max=Math.ceil(dmax/step)*step;const ticks=Math.round(max/step);const X=i=>pl+i*(W-pl-pr)/(n-1),Y=v=>pt+(Hh-pt-pb)*(1-v/max);let g='';for(let t=0;t<=ticks;t++){const v=max*t/ticks,y=Y(v);g+=`<line class="grid-line" x1="${pl}" x2="${W-pr}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text class="axis-text" x="${pl-8}" y="${(y+4).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`;}let xl='';cfg.labels.forEach((l,i)=>{xl+=`<text class="axis-text" x="${X(i).toFixed(1)}" y="${Hh-8}" text-anchor="middle">${l}</text>`;});let paths='',dots='';cfg.series.forEach(s=>{const col=`var(--${s.key})`;const pts=s.data.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1));const line='M'+pts.join(' L');const area=line+` L${X(n-1).toFixed(1)},${Y(0)} L${X(0)},${Y(0)} Z`;paths+=`<path d="${area}" fill="${col}" opacity=".1"/><path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(n-1).toFixed(1)}" cy="${Y(s.data[n-1]).toFixed(1)}" r="4" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`;dots+=`<circle class="hover-dot" r="4.5" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`;});el.innerHTML=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="趋势图">${g}${xl}${paths}<line class="xh" y1="${pt}" y2="${Hh-pb}"/>${dots}<rect class="hit" x="${pl}" y="${pt}" width="${W-pl-pr}" height="${Hh-pt-pb}" fill="transparent"/></svg>`;const svg=$('svg',el),hit=$('.hit',el),xh=$('.xh',el),hd=$$('.hover-dot',el);hit.addEventListener('mousemove',e=>{const r=svg.getBoundingClientRect();const sx=(e.clientX-r.left)*W/r.width;let i=Math.round((sx-pl)/((W-pl-pr)/(n-1)));i=Math.max(0,Math.min(n-1,i));const x=X(i);el.classList.add('hover');xh.setAttribute('x1',x);xh.setAttribute('x2',x);cfg.series.forEach((s,k)=>{hd[k].setAttribute('cx',x);hd[k].setAttribute('cy',Y(s.data[i]));});showTip(e.clientX,e.clientY,`<b>${cfg.labels[i]}</b>`+cfg.series.map(s=>`<div><span><i style="background:var(--${s.key})"></i>${s.name}</span><span>${fmt(s.data[i])}</span></div>`).join(''));});hit.addEventListener('mouseleave',()=>{el.classList.remove('hover');hideTip();});if(legendEl)legendEl.innerHTML=cfg.series.length>1?cfg.series.map(s=>`<span><i style="background:var(--${s.key})"></i>${s.name}</span>`).join(''):'';}
function hbars(el,items,opt={}){const vk=opt.vk||'req';const arr=[...items].sort((a,b)=>b[vk]-a[vk]);const max=arr[0][vk];el.innerHTML=arr.map(i=>`<div class="hbar"><div class="n"><i style="background:${i.color}"></i><span title="${i.label}">${i.label}</span></div><div class="t"><i style="width:${(100*i[vk]/max).toFixed(1)}%;background:${i.color}"></i></div><div class="v">${(opt.fmt||num)(i[vk])}${opt.sub?`<b>${opt.sub(i)}</b>`:''}</div></div>`).join('');}

const state={role:'user',area:'console',page:'dashboard',theme:'light'};
const findPage=(groups,page)=>{for(const g of groups)for(const it of g.items)if(it[2]===page)return{g,it};return null;};
function renderSidenav(){const groups=NAV[state.area];$('[data-sidenav]').innerHTML=groups.map(g=>`<button class="sd-g"><span>${g.g}</span>${ico('chev-d','xs')}</button><div class="sd-gi">${g.items.map(it=>{const[label,icon,page,b]=it;return `<button class="sd-a${page===state.page?' on':''}" data-nav="${page}">${ico(icon,'sm')}<span class="lbl">${label}</span>${b?`<span class="n${b.warn?' warn':''}">${b.n}</span>`:''}</button>`}).join('')}</div>`).join('');const hit=findPage(groups,state.page)||{g:groups[0],it:groups[0].items[0]};$('[data-crumb]').innerHTML=`<span>${state.area==='admin'?'管理后台':'控制台'}</span><span class="sl">/</span><span>${hit.g.g}</span><span class="sl">/</span><b>${hit.it[0]}</b>`;}
function apply(){if(state.role!=='admin')state.area='console';if(!findPage(NAV[state.area],state.page))state.page=NAV[state.area][0].items[0][2];
 $$('[data-area-switch]').forEach(sw=>{sw.hidden=state.role!=='admin';$$('button',sw).forEach(b=>b.classList.toggle('on',b.dataset.area===state.area));});
 $$('.chips[data-ctl] .chip').forEach(c=>{const ctl=c.closest('[data-ctl]').dataset.ctl;c.classList.toggle('on',c.dataset.v===state[ctl]);});
 root.dataset.theme=state.theme;$$('[data-theme-toggle] use').forEach(u=>u.setAttribute('href',state.theme==='dark'?'#i-sun':'#i-moon'));const tl=$('[data-theme-toggle] .lbl');if(tl)tl.textContent=state.theme==='dark'?'浅色模式':'深色模式';
 renderSidenav();const slot=$('[data-slot]');slot.innerHTML=`<div class="pg">${PAGES[state.page]()}</div>`;document.title='ZenTok · '+(findPage(NAV[state.area],state.page)?.it[0]||'控制台');window.scrollTo({top:0});requestAnimationFrame(()=>renderCharts(slot));}
document.addEventListener('click',e=>{
 const chip=e.target.closest('.chips[data-ctl] .chip');if(chip){const ctl=chip.closest('[data-ctl]').dataset.ctl;state[ctl]=chip.dataset.v;if(ctl==='role'){state.area=chip.dataset.v==='admin'?'admin':'console';state.page=state.area==='admin'?'adminDashboard':'dashboard';}apply();return;}
 const area=e.target.closest('[data-area-switch] button');if(area){state.area=area.dataset.area;state.page=state.area==='admin'?'adminDashboard':'dashboard';apply();return;}
 const nav=e.target.closest('[data-nav]');if(nav){state.page=nav.dataset.nav;apply();return;}
 const g=e.target.closest('.sd-g');if(g){g.classList.toggle('closed');return;}
 if(e.target.closest('[data-theme-toggle]')){state.theme=state.theme==='dark'?'light':'dark';apply();return;}
 if(e.target.closest('[data-collapse]')){const s=$('#shell');s.dataset.collapsed=s.dataset.collapsed==='true'?'false':'true';const l=$('[data-collapse] .lbl');if(l)l.textContent=s.dataset.collapsed==='true'?'展开侧栏':'收起侧栏';return;}
 if(e.target.closest('#dp-toggle')){$('#dp').classList.toggle('min');return;}
 const tg=e.target.closest('.toggle');if(tg){tg.classList.toggle('on');tg.setAttribute('aria-checked',tg.classList.contains('on'));return;}
 const c=e.target.closest('.chips:not([data-ctl]) .chip,.kl-f .chip,.amt,.pay button');if(c){$$(c.matches('.amt')?'.amt':c.matches('.pay button')?'button':'.chip',c.parentElement).forEach(x=>x.classList.remove('on'));c.classList.add('on');return;}
 const tab=e.target.closest('.tab');if(tab){$$('.tab',tab.parentElement).forEach(x=>x.classList.remove('on'));tab.classList.add('on');return;}
 const it=e.target.closest('.kl-item');if(it){$$('.kl-item',it.parentElement).forEach(x=>x.classList.remove('on'));it.classList.add('on');return;}
 if(e.target.closest('a[href="#"]'))e.preventDefault();
});
state.theme=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
apply();
})();
